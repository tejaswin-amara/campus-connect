services:
  mysql:
    image: mysql:8.0
    container_name: campus_events_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQLDATABASE:-campus_events}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_USER: ${MYSQLUSER:-campus_app}
      MYSQL_PASSWORD: ${MYSQLPASSWORD:-campus_app_password}
    ports:
      - "127.0.0.1:${MYSQL_LOCAL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD:-root_password} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      default:
        aliases:
          - db

  app:
    build:
      context: .
      args:
        PORT: ${PORT:-8080}
    image: campus-connect:latest
    container_name: campus_events_app
    restart: unless-stopped
    init: true
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${PORT:-8080}:${PORT:-8080}"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      PORT: ${PORT:-8080}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/${MYSQLDATABASE:-campus_events}?allowPublicKeyRetrieval=true&useSSL=${MYSQL_USE_SSL:-false}&connectTimeout=10000}
      MYSQLUSER: ${MYSQLUSER:-campus_app}
      MYSQLPASSWORD: ${MYSQLPASSWORD:-campus_app_password}
      UPLOAD_DIR: /app/uploads
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin_password}
      DDL_AUTO: ${DDL_AUTO:-validate}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:8080}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - app_uploads:/app/uploads

volumes:
  mysql_data:
  app_uploads:
