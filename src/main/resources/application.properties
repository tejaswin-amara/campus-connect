server.port=${PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=framework

# MySQL Database (Robust Configuration)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:campus_events}?createDatabaseIfNotExist=${MYSQL_CREATE_DATABASE:false}&allowPublicKeyRetrieval=true&useSSL=${MYSQL_USE_SSL:false}&connectTimeout=10000}
spring.datasource.username=${MYSQLUSER:}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.connection-timeout=5000

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
app.bcrypt.strength=${BCRYPT_STRENGTH:12}

# Flyway Settings
spring.flyway.baseline-on-migrate=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# File Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Session
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=strict
server.servlet.session.tracking-modes=cookie
server.error.include-message=never
server.error.include-stacktrace=never

# Logging
logging.level.com.tejaswin.campus=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}
# App
spring.web.resources.static-locations=classpath:/static/
app.upload-dir=${UPLOAD_DIR:uploads}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}

# Admin seed password (configurable via env var)
app.admin-password=${ADMIN_PASSWORD:}

# Resilience4j Configuration
resilience4j.circuitbreaker.instances.registrationService.register-health-indicator=true
resilience4j.circuitbreaker.instances.registrationService.sliding-window-size=10
resilience4j.circuitbreaker.instances.registrationService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.registrationService.sliding-window-type=count_based
resilience4j.circuitbreaker.instances.registrationService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.registrationService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.registrationService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.registrationService.event-consumer-buffer-size=10

# Actuator Health Check
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:never}
management.health.mysql.enabled=true
