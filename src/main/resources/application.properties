spring.application.name=campus-event-manager
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:127.0.0.1}:${MYSQLPORT:3306}/${MYSQLDATABASE:campus_events}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&connectTimeout=10000}
spring.datasource.username=${MYSQLUSER:campus_app}
spring.datasource.password=${MYSQLPASSWORD:campus_app_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${PORT:9090}
server.shutdown=graceful
server.error.include-message=always

# Security Hardening
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

campus.cookie.secure=${COOKIE_SECURE:true}

# File Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
