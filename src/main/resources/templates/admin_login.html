<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect — Admin Authentication</title>
    
    <!-- Design System Typography & Frameworks -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <link rel="stylesheet" th:href="@{/css/style.css?v=20}">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <script th:src="@{/js/main.js?v=20}" defer></script>
    
    <style>
        body {
            background-color: #09090b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glow Backdrop */
        .ambient-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background:
                radial-gradient(circle at 20% 25%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 80% 75%, rgba(168, 85, 247, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(9, 9, 11, 0.9) 0%, #09090b 100%);
            pointer-events: none;
        }

        .login-card {
            background: rgba(18, 18, 24, 0.85);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2.75rem 2.5rem;
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
            box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(99, 102, 241, 0.12);
        }

        .login-card:hover {
            border-color: rgba(99, 102, 241, 0.35);
        }

        .form-control-login {
            background: rgba(20, 20, 30, 0.8) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #ffffff !important;
            border-radius: 10px !important;
            padding: 0.75rem 1rem !important;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-control-login:focus {
            border-color: #6366f1 !important;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15) !important;
            background: rgba(24, 24, 36, 0.95) !important;
        }

        .password-toggle-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 0 12px;
        }
        .password-toggle-btn:hover {
            color: #ffffff;
        }
    </style>
</head>

<body>
    <div class="ambient-mesh"></div>

    <div class="container d-flex align-items-center justify-content-center min-vh-100 px-3 py-4">
        <div class="login-card animate-in">
            <!-- Brand Mark -->
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
                    style="width: 56px; height: 56px; background: rgba(99, 102, 241, 0.18); border: 1px solid rgba(99, 102, 241, 0.4); box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);">
                    <i class="bi bi-mortarboard-fill text-primary fs-3"></i>
                </div>
                <h1 class="h4 fw-bold text-white mb-1" style="letter-spacing: -0.02em;">Admin Control Plane</h1>
                <p class="text-muted small mb-0">Authorized department credentials required</p>
            </div>

            <!-- Security Audit Pill -->
            <div class="mb-4 p-2 rounded-3 text-center" style="background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.25);">
                <div class="d-flex align-items-center justify-content-center gap-2 text-primary-light" style="font-size: 0.72rem; font-weight: 500;">
                    <i class="bi bi-shield-check text-primary"></i>
                    <span>Protected by BCrypt & Bucket4j Rate Limiter</span>
                </div>
            </div>

            <!-- Error Alerts -->
            <div th:if="${error}" class="alert alert-danger py-2 px-3 small d-flex align-items-center gap-2 rounded-3 mb-3 border-danger border-opacity-30" role="alert" style="background: rgba(239, 68, 68, 0.15); color: #fca5a5;">
                <i class="bi bi-exclamation-octagon-fill flex-shrink-0"></i>
                <span th:text="${error}">Invalid credentials</span>
            </div>

            <div th:if="${param.error}" class="alert alert-danger py-2 px-3 small d-flex align-items-center gap-2 rounded-3 mb-3 border-danger border-opacity-30" role="alert" style="background: rgba(239, 68, 68, 0.15); color: #fca5a5;">
                <i class="bi bi-exclamation-octagon-fill flex-shrink-0"></i>
                <span>Authentication failed. Please check username and password.</span>
            </div>

            <!-- Login Form -->
            <form th:action="@{/admin/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="mb-3">
                    <label for="username" class="form-label small fw-bold text-muted" style="font-size: 0.75rem;">USERNAME</label>
                    <div class="position-relative">
                        <input type="text" class="form-control form-control-login ps-3" id="username" name="username"
                            placeholder="admin" required autocomplete="username" autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="password" class="form-label small fw-bold text-muted mb-0" style="font-size: 0.75rem;">PASSWORD</label>
                    </div>
                    <div class="input-group">
                        <input type="password" class="form-control form-control-login" id="password" name="password"
                            placeholder="••••••••••••" required autocomplete="current-password">
                        <button type="button" class="password-toggle-btn border border-start-0 rounded-end-3" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility" style="border-color: rgba(255, 255, 255, 0.1) !important; background: rgba(20, 20, 30, 0.8);">
                            <i class="bi bi-eye" id="pwdToggleIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary py-2 px-3 fw-bold rounded-3 d-flex align-items-center justify-content-center gap-2" style="font-size: 0.95rem;">
                        <span>Sign In to Admin Console</span>
                        <i class="bi bi-arrow-right"></i>
                    </button>
                </div>

                <div class="text-center pt-2">
                    <a th:href="@{/}" class="text-secondary small text-decoration-none hover-primary">
                        <i class="bi bi-arrow-left me-1"></i> Return to Student Events Catalogue
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const icon = document.getElementById('pwdToggleIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                pwdInput.type = 'password';
                icon.className = 'bi bi-eye';
            }
        }
    </script>
</body>

</html>
