<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error — CampusConnect</title>
    
    <!-- Fonts & Bootstrap -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/style.css?v=20}">

    <style>
        body {
            background-color: #09090b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            overflow-x: hidden;
            position: relative;
        }

        .ambient-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(circle at 50% 40%, rgba(239, 68, 68, 0.12) 0%, transparent 60%);
            pointer-events: none;
        }

        .error-card {
            background: rgba(18, 18, 24, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            max-width: 500px;
            width: 100%;
            position: relative;
            z-index: 1;
            box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.7);
        }
    </style>
</head>

<body>
    <div class="ambient-glow"></div>

    <div class="container d-flex align-items-center justify-content-center px-3">
        <div class="error-card text-center animate-in">
            <!-- Icon -->
            <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
                style="width: 72px; height: 72px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.35); box-shadow: 0 0 24px rgba(239, 68, 68, 0.2);">
                <i class="bi bi-exclamation-triangle-fill text-danger fs-1"></i>
            </div>

            <h1 class="h3 fw-bold text-white mb-2" style="letter-spacing: -0.02em;">Something went wrong</h1>
            <p class="text-secondary small mb-4">
                The resource or event you requested could not be displayed. It may have expired or been relocated.
            </p>

            <!-- Diagnostic Box -->
            <div class="p-3 rounded-3 mb-4 text-start" style="background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(255, 255, 255, 0.08);">
                <div class="d-flex align-items-center justify-content-between mb-2 pb-2 border-bottom border-secondary border-opacity-20">
                    <span class="text-muted small fw-bold text-uppercase" style="font-size: 0.68rem; letter-spacing: 0.05em;">Diagnostic Info</span>
                    <span class="badge bg-danger bg-opacity-20 text-danger border border-danger border-opacity-30" th:text="${status} ?: '500'">500</span>
                </div>

                <div class="small font-monospace text-break" style="color: #fca5a5; font-size: 0.85rem;">
                    <span th:if="${status == 404}">HTTP 404 — The requested endpoint does not exist.</span>
                    <span th:unless="${status == 404}" th:text="${message} ?: 'Internal application exception occurred.'">Error message</span>
                </div>
            </div>

            <!-- Actions -->
            <div class="d-grid gap-2 mb-3">
                <a th:href="@{/}" class="btn btn-primary py-2 px-3 fw-bold rounded-3">
                    <i class="bi bi-house-door me-1"></i> Return to Campus Events
                </a>
                <button onclick="history.back()" class="btn btn-outline-secondary py-2 px-3 text-white rounded-3">
                    <i class="bi bi-arrow-left me-1"></i> Go Back
                </button>
            </div>
        </div>
    </div>
</body>

</html>
