name: Production Delivery Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  frontend-gate:
    name: Frontend Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-redesign
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend-redesign/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Biome Linter & Formatter Check
        run: pnpm exec biome check src/ tests/

      - name: Strict TypeScript Compilation
        run: pnpm exec tsc --noEmit

      - name: Vitest Component & Unit Tests
        run: pnpm exec vitest run --coverage

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright E2E & Axe Accessibility Tests
        run: pnpm exec playwright test

      - name: Build Production Assets
        run: pnpm run build

  backend-gate:
    name: Backend Verification
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: campus_events
          MYSQL_USER: campus_app
          MYSQL_PASSWORD: campus_app_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run Backend Unit & Integration Tests
        env:
          SPRING_PROFILES_ACTIVE: default
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/campus_events?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&connectTimeout=10000
          MYSQLHOST: 127.0.0.1
          MYSQLPORT: 3306
          MYSQLDATABASE: campus_events
          MYSQLUSER: campus_app
          MYSQLPASSWORD: campus_app_password
          ADMIN_PASSWORD: test-admin-password
          DDL_AUTO: validate
          COOKIE_SECURE: false
          LOG_LEVEL: INFO
        run: ./mvnw -B verify

  security-gate:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy Filesystem Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
