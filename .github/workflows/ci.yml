name: Production Delivery Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    name: Lint Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.9.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.1.0

      - name: zizmor
        uses: advanced-security/zizmor-action@365df9f035d4b5177b9cd57330f8c3dfa6134420 # main

  secrets:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.9.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.6

  sast:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.9.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f0f3afee809481da311ca3a6ff1ff51d81dbe349 # v3.26.11
        with:
          languages: java, javascript

      - name: Autobuild CodeQL
        uses: github/codeql-action/autobuild@f0f3afee809481da311ca3a6ff1ff51d81dbe349 # v3.26.11

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f0f3afee809481da311ca3a6ff1ff51d81dbe349 # v3.26.11

      - name: Semgrep
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1.1.0
        with:
          config: "p/default"

  deps:
    name: Dependency Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.9.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a96bc4d2b09685b6142bcfe25a3dc17cb2d7347 # v1.9.1
        with:
          scan-args: |-
            --config=.github/allowlists/osv-allowlist.json
            -r
            .

      - name: Syft SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.17.4
        with:
          file: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Grype Vulnerability Scan
        uses: anchore/scan-action@3343887d815d7b07465f6fdcd395bd66508d486a # v3.3.8
        with:
          sbom: sbom.spdx.json
          fail-build: true
          severity-cutoff: high

  backend-gate:
    name: Backend Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: campus_events
          MYSQL_USER: campus_app
          MYSQL_PASSWORD: campus_app_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.9.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.4.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run Backend Unit & Integration Tests
        env:
          SPRING_PROFILES_ACTIVE: default
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/campus_events?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&connectTimeout=10000
          MYSQLHOST: 127.0.0.1
          MYSQLPORT: 3306
          MYSQLDATABASE: campus_events
          MYSQLUSER: campus_app
          MYSQLPASSWORD: campus_app_password
          ADMIN_PASSWORD: test-admin-password
          DDL_AUTO: validate
          COOKIE_SECURE: false
          LOG_LEVEL: INFO
        run: ./mvnw -B verify

  frontend-gate:
    name: Frontend Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-redesign
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.9.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.3
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend-redesign/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Biome Linter & Formatter Check
        run: pnpm exec biome check src/ tests/

      - name: Strict TypeScript Compilation
        run: pnpm exec tsc --noEmit

      - name: Vitest Component & Unit Tests
        run: pnpm exec vitest run --coverage

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright E2E & Axe Accessibility Tests
        run: pnpm exec playwright test

      - name: Build Production Assets
        run: pnpm run build

  container:
    name: Container Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.9.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Checkov
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # master
        with:
          directory: .
          framework: dockerfile
