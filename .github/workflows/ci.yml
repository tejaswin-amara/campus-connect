name: CampusConnect CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  verify:
    name: Build, test, coverage, and dependency review
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: campus_events
          MYSQL_USER: campus_app
          MYSQL_PASSWORD: campus_app_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Build and verify
        env:
          SPRING_PROFILES_ACTIVE: default
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/campus_events?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&connectTimeout=10000
          MYSQLHOST: 127.0.0.1
          MYSQLPORT: 3306
          MYSQLDATABASE: campus_events
          MYSQLUSER: campus_app
          MYSQLPASSWORD: campus_app_password
          # Test fixture only; production deployments must provide a unique secret.
          ADMIN_PASSWORD: test-admin-password
          DDL_AUTO: validate
          COOKIE_SECURE: false
          LOG_LEVEL: INFO
        run: ./mvnw -B verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: campus-connect:${{ github.sha }}

