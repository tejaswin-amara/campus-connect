pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks git --redact --no-banner
    frontend-typecheck:
      root: frontend-redesign
      glob: "*.{ts,tsx}"
      run: pnpm exec tsc --noEmit
    frontend-lint:
      root: frontend-redesign
      glob: "*.{ts,tsx,js,jsx}"
      run: pnpm exec biome check {staged_files}
    frontend-test:
      root: frontend-redesign
      glob: "*.{ts,tsx,js,jsx}"
      run: pnpm exec vitest run related {staged_files}
    backend-compile:
      glob: "pom.xml"
      run: ./mvnw -B test-compile

commit-msg:
  commands:
    commitlint:
      run: pnpm dlx commitlint --edit {1}
